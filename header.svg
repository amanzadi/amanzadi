<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .header-bar { fill: #161b22; }
      .border { stroke: #30363d; stroke-width: 1; fill: none; }
      .dot-r { fill: #ff5f57; }
      .dot-y { fill: #febc2e; }
      .dot-g { fill: #28c840; }
      .title {
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .term {
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        font-size: 13px;
        fill: #c9d1d9;
      }
      .ascii {
        font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        font-size: 12px;
        fill: #3fb950;
        white-space: pre;
      }
      .ascii-dna { animation: glowA 4s ease-in-out infinite; }
      .ascii-mol { animation: glowB 5s ease-in-out infinite; }
      .ascii-med { animation: glowC 3.5s ease-in-out infinite; }
      @keyframes glowA {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      @keyframes glowB {
        0%, 100% { opacity: 0.30; }
        50% { opacity: 0.55; }
      }
      @keyframes glowC {
        0%, 100% { opacity: 0.40; }
        50% { opacity: 0.70; }
      }
      .prompt-user { fill: #3fb950; font-weight: bold; }
      .prompt-sym { fill: #c9d1d9; }
      .prompt-path { fill: #d2a8ff; }
      .cmd { fill: #e6edf3; }
      .out { fill: #8b949e; }
      .hi { fill: #3fb950; }
      .key { fill: #58a6ff; }
      .acc { fill: #d2a8ff; }
      .warn { fill: #f78166; }

      .line { opacity: 0; }

      .l1 { animation: appear 0.01s linear 0.3s forwards, typewrite 1.2s steps(30) 0.3s forwards; }
      .l2 { animation: appear 0.01s linear 1.7s forwards; }
      .l3 { animation: appear 0.01s linear 2.0s forwards; }
      .l4 { animation: appear 0.01s linear 2.3s forwards; }
      .l5 { animation: appear 0.01s linear 2.6s forwards; }

      .l6 { animation: appear 0.01s linear 3.4s forwards, typewrite 1.0s steps(20) 3.4s forwards; }
      .l7 { animation: appear 0.01s linear 4.6s forwards; }
      .l8 { animation: appear 0.01s linear 4.9s forwards; }
      .l9 { animation: appear 0.01s linear 5.2s forwards; }
      .l10 { animation: appear 0.01s linear 5.5s forwards; }

      .l11 { animation: appear 0.01s linear 6.3s forwards, typewrite 1.3s steps(25) 6.3s forwards; }
      .l12 { animation: appear 0.01s linear 7.7s forwards; }
      .l13 { animation: appear 0.01s linear 8.0s forwards; }
      .l14 { animation: appear 0.01s linear 8.3s forwards; }
      .l15 { animation: appear 0.01s linear 8.6s forwards; }

      .l20 { animation: appear 0.01s linear 9.4s forwards; }
      .cursor-final { animation: appear 0.01s linear 9.4s forwards, blink 1s step-end infinite 9.6s; }

      .loop { animation: loopfade 13s linear infinite; }
      @keyframes loopfade {
        0%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes appear { to { opacity: 1; } }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes typewrite {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }

      .rotate-dna { animation: rotateDna 8s linear infinite; transform-origin: 760px 170px; }
      @keyframes rotateDna {
        0% { transform: scaleX(1); }
        50% { transform: scaleX(0.4); }
        100% { transform: scaleX(1); }
      }

      .pulse-heart { animation: heartPulse 1.2s ease-in-out infinite; transform-origin: 920px 90px; }
      @keyframes heartPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }
    </style>
  </defs>

  <g class="loop">
    <rect width="1000" height="340" class="bg" rx="8"/>

    <g class="ascii ascii-dna rotate-dna">
      <text x="730" y="50">A══════T</text>
      <text x="730" y="64"> ╲    ╱</text>
      <text x="730" y="78">  G══C</text>
      <text x="730" y="92"> ╱    ╲</text>
      <text x="730" y="106">T══════A</text>
      <text x="730" y="120"> ╲    ╱</text>
      <text x="730" y="134">  C══G</text>
      <text x="730" y="148"> ╱    ╲</text>
      <text x="730" y="162">A══════T</text>
      <text x="730" y="176"> ╲    ╱</text>
      <text x="730" y="190">  T══A</text>
      <text x="730" y="204"> ╱    ╲</text>
      <text x="730" y="218">G══════C</text>
      <text x="730" y="232"> ╲    ╱</text>
      <text x="730" y="246">  C══G</text>
      <text x="730" y="260"> ╱    ╲</text>
      <text x="730" y="274">A══════T</text>
      <text x="730" y="288"> ╲    ╱</text>
      <text x="730" y="302">  G══C</text>
    </g>

    <g class="ascii ascii-med">
      <text x="870" y="55">   ▄▀▀▄ ▄▀▀▄</text>
      <text x="870" y="69">  █ ♥♥ █ ♥♥ █</text>
      <text x="870" y="83">  █  ♥♥♥♥  █</text>
      <text x="870" y="97">   ▀▄    ▄▀</text>
      <text x="870" y="111">     ▀▄▄▀</text>
      <text x="870" y="125">      ▀</text>
      <text x="870" y="155">    ╱╲</text>
      <text x="870" y="169">   ╱██╲</text>
      <text x="870" y="183">  ╱████╲</text>
      <text x="870" y="197"> ════════</text>
      <text x="870" y="211">  ╲████╱</text>
      <text x="870" y="225">   ╲██╱</text>
      <text x="870" y="239">    ╲╱</text>
      <text x="870" y="265">  __/\__</text>
      <text x="870" y="279">_/      \_/\_</text>
      <text x="870" y="293">  ECG  ♥</text>
    </g>

    <rect width="1000" height="28" class="header-bar" rx="8"/>
    <rect y="20" width="1000" height="8" class="header-bar"/>
    <rect width="1000" height="340" class="border" rx="8"/>

    <circle cx="18" cy="14" r="5.5" class="dot-r"/>
    <circle cx="38" cy="14" r="5.5" class="dot-y"/>
    <circle cx="58" cy="14" r="5.5" class="dot-g"/>

    <text x="500" y="18" text-anchor="middle" class="title">amir@uio:~ — zsh — 100×24</text>

    <g class="term">
      <text x="20" y="58" class="line l1">
        <tspan class="prompt-user">amir@uio</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="cmd">whoami --verbose</tspan>
      </text>

      <text x="20" y="78" class="line l2"><tspan class="hi">▸</tspan> <tspan class="out">name:</tspan> <tspan class="cmd">Amir Hossein Amanzadi</tspan></text>
      <text x="20" y="94" class="line l3"><tspan class="hi">▸</tspan> <tspan class="out">role:</tspan> <tspan class="acc">Medical AI Researcher · Clinical ML Engineer</tspan></text>
      <text x="20" y="110" class="line l4"><tspan class="hi">▸</tspan> <tspan class="out">affil:</tspan> <tspan class="key">University of Oslo</tspan> <tspan class="out">/ Andreassen Lab · PhD candidate</tspan></text>
      <text x="20" y="126" class="line l5"><tspan class="hi">▸</tspan> <tspan class="out">focus:</tspan> <tspan class="cmd">bridging clinical science × graph ML × generative AI</tspan></text>

      <text x="20" y="150" class="line l6">
        <tspan class="prompt-user">amir@uio</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="cmd">cat expertise.md</tspan>
      </text>

      <text x="20" y="170" class="line l7"><tspan class="warn">#</tspan> <tspan class="cmd">Graph Neural Networks</tspan> <tspan class="out">— drug combos, PPI, multi-omics</tspan></text>
      <text x="20" y="186" class="line l8"><tspan class="warn">#</tspan> <tspan class="cmd">LLMs &amp; VLMs</tspan> <tspan class="out">— clinical RAG, radiology assistants, agents</tspan></text>
      <text x="20" y="202" class="line l9"><tspan class="warn">#</tspan> <tspan class="cmd">Cheminformatics</tspan> <tspan class="out">— PROTAC design, ADMET, generative chem</tspan></text>
      <text x="20" y="218" class="line l10"><tspan class="warn">#</tspan> <tspan class="cmd">Translational AI</tspan> <tspan class="out">— bench → bedside → production</tspan></text>

      <text x="20" y="242" class="line l11">
        <tspan class="prompt-user">amir@uio</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="cmd">git log --oneline impact/</tspan>
      </text>

      <text x="20" y="262" class="line l12"><tspan class="key">a7f3d21</tspan> <tspan class="cmd">DECISION EU</tspan> <tspan class="out">— 3 cirrhosis treatments → Phase II trials</tspan></text>
      <text x="20" y="278" class="line l13"><tspan class="key">b2e8c14</tspan> <tspan class="cmd">Xanthos</tspan> <tspan class="out">— patented PROTAC hits vs. α-synuclein</tspan></text>
      <text x="20" y="294" class="line l14"><tspan class="key">c5a1f09</tspan> <tspan class="cmd">Yara</tspan> <tspan class="out">— VLM radiology assistant in production</tspan></text>
      <text x="20" y="310" class="line l15"><tspan class="key">d8b4e72</tspan> <tspan class="cmd">Medhoush</tspan> <tspan class="out">— clinical chat AI, 40k+ active users</tspan></text>

      <text x="20" y="332" class="line l20">
        <tspan class="prompt-user">amir@uio</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="cursor-final" fill="#3fb950">▊</tspan>
      </text>
    </g>
  </g>
</svg>
